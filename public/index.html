<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Agente de Concursos</title></head>
<body>
<script>
  fetch('/api/me').then(r => {
    if (!r.ok) { window.location.href = '/login.html'; return; }
    return r.json();
  }).then(me => {
    if (!me) return;
    window.location.href = me.rol === 'director' ? '/panel-director.html' : '/panel-equipo.html';
  }).catch(() => window.location.href = '/login.html');
</script>
</body></html>
