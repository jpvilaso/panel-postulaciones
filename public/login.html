<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Agente de Concursos — Ingreso</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>Agente de Concursos Públicos</h1>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <button class="btn" type="submit">Ingresar</button>
        <div class="login-error" id="err" style="display:none"></div>
      </form>
      <form id="totpForm" style="display:none">
        <label for="codigo">Código de tu app de autenticación</label>
        <input type="text" id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" />
        <div class="login-hint" id="usarRespaldoToggle" style="cursor:pointer; text-decoration:underline">
          ¿Perdiste tu teléfono? Usa un código de respaldo
        </div>
        <div id="respaldoWrap" style="display:none">
          <label for="codigoRespaldo">Código de respaldo</label>
          <input type="text" id="codigoRespaldo" name="codigoRespaldo" placeholder="XXXXX-XXXXX" />
        </div>
        <button class="btn" type="submit">Verificar</button>
        <div class="login-error" id="errTotp" style="display:none"></div>
      </form>
      <div class="login-hint" id="demoHint">
        Demo — usuarios de prueba (clave <code>concursos2026</code> para todos):<br>
        mrojas@ceodoc.cl · jsoto@ceodoc.cl · pdiaz@ceodoc.cl (equipo)<br>
        directora@fundacion.cl (director) · admin@fundacion.cl (admin)
      </div>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        if (data.requiereTotp) {
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('demoHint').style.display = 'none';
          document.getElementById('totpForm').style.display = 'block';
          document.getElementById('codigo').focus();
          return;
        }
        window.location.href = destinoFinal(data.destino);
      } catch (e2) {
        err.textContent = e2.message;
        err.style.display = 'block';
      }
    });

    document.getElementById('usarRespaldoToggle').addEventListener('click', () => {
      document.getElementById('respaldoWrap').style.display = 'block';
    });

    document.getElementById('totpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const codigo = document.getElementById('codigo').value.trim();
      const codigoRespaldo = document.getElementById('codigoRespaldo').value.trim();
      const errTotp = document.getElementById('errTotp');
      errTotp.style.display = 'none';
      try {
        const r = await fetch('/api/login/totp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo: codigo || undefined, codigoRespaldo: codigoRespaldo || undefined }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error');
        if (data.avisoCodigosRespaldo) alert(data.avisoCodigosRespaldo);
        window.location.href = destinoFinal(data.destino);
      } catch (e2) {
        errTotp.textContent = e2.message;
        errTotp.style.display = 'block';
      }
    });
  </script>
</body>
</html>
