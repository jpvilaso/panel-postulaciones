<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Agente de Concursos — Cambiar contraseña</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>Cambia tu contraseña</h1>
      <p class="small muted" id="motivo">Es obligatorio cambiar la contraseña antes de continuar.</p>
      <form id="cambioForm">
        <label for="passwordActual">Contraseña actual</label>
        <input type="password" id="passwordActual" name="passwordActual" autocomplete="current-password" required />
        <label for="passwordNueva">Contraseña nueva</label>
        <input type="password" id="passwordNueva" name="passwordNueva" autocomplete="new-password" minlength="8" maxlength="64" required />
        <label for="passwordNuevaRepetir">Repite la contraseña nueva</label>
        <input type="password" id="passwordNuevaRepetir" name="passwordNuevaRepetir" autocomplete="new-password" minlength="8" maxlength="64" required />
        <div class="login-hint">
          Mínimo 8 caracteres, máximo 64. Sin reglas de mayúscula/número/símbolo obligatorias —
          se revisa en cambio que no aparezca en filtraciones conocidas.
        </div>
        <button class="btn" type="submit">Cambiar contraseña</button>
        <div class="login-error" id="err" style="display:none"></div>
      </form>
    </div>
  </div>
  <script src="/common.js"></script>
  <script>
    document.getElementById('cambioForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const passwordActual = document.getElementById('passwordActual').value;
      const passwordNueva = document.getElementById('passwordNueva').value;
      const passwordNuevaRepetir = document.getElementById('passwordNuevaRepetir').value;
      const err = document.getElementById('err');
      err.style.display = 'none';
      if (passwordNueva !== passwordNuevaRepetir) {
        err.textContent = 'Las dos contraseñas nuevas no coinciden.';
        err.style.display = 'block';
        return;
      }
      // Fetch directo, no el helper api() de common.js -- ese redirige solo
      // a /login.html en cualquier 401, y acá un 401 típico es "escribiste
      // mal tu contraseña actual", que se debe mostrar en esta misma página.
      try {
        const r = await fetch('/api/cambiar-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passwordActual, passwordNueva }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'No se pudo cambiar la contraseña.');
        window.location.href = destinoFinal(data.destino);
      } catch (e2) {
        err.textContent = e2.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
